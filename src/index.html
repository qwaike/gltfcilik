<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Poop Game - Fly and Poop!</title>
</head>
<body>
    <canvas class="webgl"></canvas>
    
    <div class="ui">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="instructions">
            <h2>Bird Poop Game</h2>

            <p>Click or Space to poop on people!</p>
            <p>Hit as many people as you can!</p>
        </div>
    </div>
</body>
</html>
